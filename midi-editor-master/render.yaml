# The app now runs entirely in the browser (voice -> MIDI, piano roll, MIDI import/export),
# so only the static site is needed.
services:
  - type: static
    name: midi-editor-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

